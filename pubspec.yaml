name: sky_home
description: >-
  Flutter widget package for rendering dynamic Shopify home pages powered by
  the SkyHome page-builder app. Drop in one widget — sections update live from
  the Shopify Admin with no app release needed.
version: 0.1.0
homepage: https://github.com/ncr9108/sky_home
repository: https://github.com/ncr9108/sky_home
issue_tracker: https://github.com/ncr9108/sky_home/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  # No assets or fonts needed — all content is loaded from network URLs.
